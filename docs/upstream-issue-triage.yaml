# Upstream open-issue triage — rohitg00/agentmemory
#
# Scope: every open issue (not PR) on the upstream repository, scored on two axes.
# This fork does not merge from upstream (see CLAUDE.md); this is a survey of known
# defects in the shared code lineage, used to decide what is worth fixing here.
#
# severity   — user impact if unfixed:
#   high  data loss, daemon/worker crash or unavailability, cross-agent or cross-user
#         leakage, silent corruption, or a headline feature that never works at all
#   med   broken in a specific configuration, wrong or incomplete results, avoidable
#         LLM spend, install/connect failure with a workaround
#   low   cosmetic, documentation, small UX, or a nice-to-have request
#
# difficulty — cost to fix in this codebase:
#   low   one or a few call sites, parameter plumbing, config or guard
#   med   several modules plus tests, a new endpoint, or a migration
#   high  architectural change, engine/dependency-level work, or a new subsystem
#
# kind — bug | feature | docs | chore | question | report | promo
#
# disposition — what this fork intends to do:
#   already-fixed  verified fixed in this tree; `fixed_by` names the evidence
#   wont-fix       out of scope here; `wont_fix_reason` says why
#   candidate      applies here and is unclaimed — the working set
#
# status — present only where the claim was checked against this tree by reading the
# code. "present-here" means the defect reproduces here as reported;
# "partly-present-here" means part of it was already fixed; "unresolved" means this
# tree cannot settle it. Absent means unchecked: the note is still upstream's claim.
#
# fix_prs          — open upstream PRs whose title or body claims to close this issue
#                    (closing keyword). Read the PR before writing the fix here; several
#                    issues have competing PRs, and none of them are merged.
# mentioned_by_prs — open PRs that reference the issue without claiming to close it.
# Absent fields mean no open PR references the issue. 168 of the 291 open PRs reference
# no open issue at all and are NOT represented here.
# Snapshot: 308 open issues, cross-linked against 291 open PRs, as of
# 2026-09-21 (gh issue list / gh pr list --repo rohitg00/agentmemory).


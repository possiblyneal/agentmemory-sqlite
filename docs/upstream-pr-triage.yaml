# Upstream orphan-PR triage — rohitg00/agentmemory
#
# Scope: the 168 open upstream PRs that reference no open upstream issue, and are
# therefore absent from docs/upstream-issue-triage.yaml. The other 123 open PRs are
# cross-linked from the issues they claim to fix in that file.
#
# This fork does not merge, rebase or cherry-pick from upstream (see CLAUDE.md). These
# rows are read for the defect and the diagnosis, not for the patch.
#
# kind — fix | feature | provider | host | deps | docs | test | ci | deploy
#
# relevance — worth acting on in THIS fork:
#   high  a real defect or a recall-quality gain in code this fork carries and runs
#   med   applies here, but narrower: one host, one provider path, or a smaller win
#   low   another host/provider/deploy target, dependency bumps, or code absent here
#
# in_fork — <paths this fork tracks>/<paths the PR touches>. A low ratio usually means
# the PR lands in files this fork deleted (deploy/, README translations, iii engine
# config, dropped hosts) — read it before assuming it does not apply.
# paths lists only the tracked ones, capped at 10.
#
# disposition — what this fork intends to do:
#   already-fixed  verified fixed in this tree; see status
#   wont-fix       out of scope here; wont_fix_reason says why
#   candidate      applies here and is unclaimed — the working set
#
# status — present only where the claim was checked against this tree by reading the
# code. "fixed-here" means this fork already carries the fix; "present-here" means the
# defect reproduces here as reported; "partly-present-here" means part of it was already
# fixed. Absent means unchecked: the note is still upstream's claim.
#
# Snapshot: 168 orphan PRs as of 2026-09-21 (gh pr list --repo rohitg00/agentmemory,
# changed files from repos/rohitg00/agentmemory/pulls/N/files).


name: CI

# `paths-ignore` keeps doc-only churn from
# burning runner minutes. Source / config / workflow changes always run.
# `workflow_dispatch` gives a manual re-run button for flake debugging.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
      - "**/*.mdx"
  workflow_dispatch:

# Cancel in-flight PR runs when a force-push lands. Keep push runs to
# protect against partial state on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Linux only: the one Operator runs the daemon on Linux, so macOS and
    # Windows legs cost CI time without covering a host anyone uses.
    runs-on: ubuntu-latest
    strategy:
      # Don't bail the whole matrix on one cell's failure — we want to
      # see whether a failure reproduces across Node versions.
      fail-fast: false
      matrix:
        # Node 20 dropped: the Engine imports node:sqlite (ADR 0001), which
        # only exists from 22.5 and is unflagged from 22.13, so every inproc
        # test fails at import on 20.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # `npm ci` over the committed package-lock.json, so every leg installs
      # the tree the lockfile pins rather than whatever npm resolves that day.
      - run: npm ci --no-audit --no-fund
      - id: build
        run: npm run build
      - run: npm run skills:check
      - run: npm run typecheck
      - run: npm test
      # One leg is enough because the numbers do not depend on the Node
      # version. It runs even when unit tests fail, so a ranking change shows
      # its Recall cost alongside them, but not when install or build failed.
      - name: Recall quality gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.node-version == 22 }}
        run: npm run eval:gate
